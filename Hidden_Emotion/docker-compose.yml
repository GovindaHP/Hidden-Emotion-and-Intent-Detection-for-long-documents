version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: hidden_emotion_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hidden_emotion_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=hidden_emotion_db
      - SECRET_KEY=super-secret-hidden-emotion-intent-key-2026-production
    depends_on:
      - mongodb
    restart: always

volumes:
  mongo_data:
